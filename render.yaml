# Render Blueprint — sync this repo to configure services automatically.
# Manual setup: see README "Deploy API on Render".

services:
  - type: web
    name: marmaradar-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_IDS
        sync: false
      - key: APPLE_OAUTH_CLIENT_IDS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_TTS_API_KEY
        sync: false
      - key: TTS_CACHE_DIR
        value: "/tmp/tts"
      - key: TTS_WARM_ON_START
        value: "true"

  - type: web
    name: marmaradar-gateway
    runtime: docker
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
