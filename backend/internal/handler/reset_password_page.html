<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre sıfırlama · Marmaradar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0B0B0D; color: #F7F7F8; font-family: Arial, Helvetica, sans-serif; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .wrap { width: 100%; max-width: 420px; }
    .brand { margin: 0 0 24px; text-align: center; font-size: 22px; font-weight: 900; letter-spacing: 2.4px; color: #E8262D; }
    .card { background: #161619; border: 1px solid #2E2E34; border-radius: 16px; overflow: hidden; }
    .accent { height: 4px; background: #E8262D; }
    .body { padding: 32px 28px 36px; }
    .kicker { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: #E8262D; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.3; }
    p { margin: 0 0 20px; font-size: 15px; line-height: 1.6; color: #B9B9C0; }
    label { display: block; margin: 0 0 6px; font-size: 13px; color: #B9B9C0; }
    input { width: 100%; margin: 0 0 16px; padding: 14px 16px; background: #212126; border: 1px solid #2E2E34; border-radius: 14px; color: #F7F7F8; font-size: 16px; }
    input:focus { outline: none; border-color: #E8262D; }
    button { width: 100%; margin-top: 8px; padding: 14px 20px; border: 0; border-radius: 999px; background: #E8262D; color: #F7F7F8; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { margin: 0 0 16px; font-size: 14px; }
    .msg.error { color: #E8262D; }
    .msg.ok { color: #3DDC84; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="brand">MARMARADAR</p>
    <div class="card">
      <div class="accent"></div>
      <div class="body">
        <p class="kicker">Güvenlik</p>
        <h1>Yeni şifre belirleyin</h1>
        <p>Bağlantı 1 saat geçerlidir. Şifreniz en az 8 karakter olmalıdır.</p>
        <p id="status" class="msg hidden"></p>
        <form id="form">
          <label for="password">Yeni şifre</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <label for="confirm">Şifre tekrar</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
          <button id="submit" type="submit">Şifreyi güncelle</button>
        </form>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = (params.get("token") || "").trim();
      var form = document.getElementById("form");
      var status = document.getElementById("status");
      var button = document.getElementById("submit");

      function show(kind, text) {
        status.className = "msg " + kind;
        status.textContent = text;
        status.classList.remove("hidden");
      }

      if (!token) {
        form.classList.add("hidden");
        show("error", "Geçersiz sıfırlama bağlantısı. Lütfen e-postadaki bağlantıyı kullanın.");
        return;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var password = document.getElementById("password").value;
        var confirm = document.getElementById("confirm").value;
        if (password.length < 8) {
          show("error", "Şifre en az 8 karakter olmalıdır.");
          return;
        }
        if (password !== confirm) {
          show("error", "Şifreler eşleşmiyor.");
          return;
        }
        button.disabled = true;
        fetch("/v1/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Accept": "application/json" },
          body: JSON.stringify({ token: token, password: password })
        }).then(function (resp) {
          return resp.json().then(function (body) {
            return { ok: resp.ok, body: body };
          }).catch(function () {
            return { ok: resp.ok, body: {} };
          });
        }).then(function (result) {
          if (result.ok) {
            form.classList.add("hidden");
            show("ok", "Şifreniz güncellendi. Uygulamadan yeni şifrenizle giriş yapabilirsiniz.");
            return;
          }
          var err = result.body && result.body.error;
          show("error", err || "Şifre güncellenemedi. Bağlantı süresi dolmuş olabilir.");
          button.disabled = false;
        }).catch(function () {
          show("error", "Sunucuya ulaşılamadı. Lütfen tekrar deneyin.");
          button.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
