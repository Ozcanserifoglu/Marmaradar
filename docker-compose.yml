services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar_alert
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_alert"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: backend
      dockerfile: Dockerfile
    environment:
      # Override via .env DATABASE_URL on the GCP VM (Neon). Local default is the compose db service.
      DATABASE_URL: ${DATABASE_URL:-postgres://radar:radar@db:5432/radar_alert?sslmode=disable}
      PORT: "8080"
      MIGRATIONS_DIR: /migrations
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_TTS_API_KEY: ${GOOGLE_TTS_API_KEY:-}
      TTS_CACHE_DIR: /var/cache/tts
      TTS_VOICE: ${TTS_VOICE:-tr-TR-Standard-A}
      TTS_WARM_ON_START: ${TTS_WARM_ON_START:-true}
      UPLOAD_DIR: /var/cache/uploads
      GEO_RESTRICT_COUNTRIES: ${GEO_RESTRICT_COUNTRIES:-TR}
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_OAUTH_CLIENT_IDS: ${GOOGLE_OAUTH_CLIENT_IDS:-}
      APPLE_OAUTH_CLIENT_IDS: ${APPLE_OAUTH_CLIENT_IDS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: "${RESEND_FROM:-Marmaradar <noreply@marmaradar.com>}"
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-support@marmaradar.com}
      EMAIL_APP_BASE_URL: ${EMAIL_APP_BASE_URL:-https://marmaradar.com}
    volumes:
      - tts_cache:/var/cache/tts
      - uploads_cache:/var/cache/uploads
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: krakend:2.13
    ports:
      - "8081:8080"
    volumes:
      - ./gateway/config/krakend.tmpl:/etc/krakend/krakend.tmpl
      - ./gateway/config/settings/local:/etc/krakend/settings/local
    environment:
      FC_ENABLE: "1"
      FC_SETTINGS: /etc/krakend/settings/local
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    depends_on:
      - api

volumes:
  pgdata:
  tts_cache:
  uploads_cache:
