services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar_alert
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar_alert"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://radar:radar@db:5432/radar_alert?sslmode=disable
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: krakend:2.13
    ports:
      - "8081:8080"
    volumes:
      - ./gateway/config/krakend.tmpl:/etc/krakend/krakend.tmpl
      - ./gateway/config/settings/local:/etc/krakend/settings/local
    environment:
      FC_ENABLE: "1"
      FC_SETTINGS: /etc/krakend/settings/local
    command: ["run", "-c", "/etc/krakend/krakend.tmpl"]
    depends_on:
      - api

volumes:
  pgdata:
