name: radar_alert
description: Marmaradar - speed camera and corridor warnings for Marmara region drivers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  drift: ^2.34.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  audioplayers: ^6.1.0
  audio_session: ^0.1.25
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  google_maps_flutter: ^2.12.1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.6
  flutter_quick_video_encoder: ^1.7.2
  gal: ^2.3.2
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.16.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/marmaradar_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/app_icon_adaptive.png
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#000000"
  image: assets/branding/marmaradar_logo.png
  android: true
  ios: true
  android_12:
    color: "#000000"
    image: assets/branding/marmaradar_logo.png
    icon_background_color: "#000000"
